<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:sans-serif}</style>
</head>
<body class="bg-gray-50">
<div class="bg-white border-b sticky top-0 z-20">
<div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
<div class="flex gap-3 items-center"><div id="badge-vendedor" class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white font-black">V</div><b id="titulo-vendedor">Catálogo</b></div>
<div class="flex gap-2 flex-wrap"><button onclick="vista('cliente')" class="px-3 py-1.5 bg-black text-white rounded-full text-sm">Cliente</button><button onclick="vista('admin')" class="px-3 py-1.5 bg-gray-100 rounded-full text-sm">Panel</button><button onclick="verCarrito()" class="px-3 py-1.5 bg-emerald-500 text-white rounded-full text-sm">🛒 <span id="count">0</span></button><button onclick="salirVendedor()" class="px-3 py-1.5 bg-rose-100 text-rose-700 rounded-full text-sm font-semibold">Salir</button></div>
</div></div>

<div id="v-cliente" class="max-w-5xl mx-auto p-4">
<input id="busc" oninput="pintar()" placeholder="Buscar lavandina, jabón..." class="w-full p-3 rounded-2xl border">
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4"></div>
</div>

<div id="v-admin" class="hidden max-w-5xl mx-auto p-4">
<div class="bg-white p-5 rounded-3xl border">
<h2 class="font-bold">Cargar productos</h2>
<p class="text-xs text-gray-500 mb-3">Subí la foto que él te mandó, poné precio y listo.</p>
<input id="n" placeholder="Nombre Ej: Skip 800ml" class="w-full border rounded-xl p-2 mb-2 text-sm">
<input id="p" type="number" placeholder="Precio Ej: 189" class="w-full border rounded-xl p-2 mb-2 text-sm">
<select id="c" class="w-full border rounded-xl p-2 mb-2 text-sm"><option value="limpieza">Limpieza</option><option value="comida">Comida</option><option value="higiene">Higiene</option></select>
<input id="foto" type="file" accept="image/*" class="w-full text-sm mb-3">
<button onclick="agregar()" class="w-full bg-black text-white rounded-xl py-3 font-bold text-sm">+ Agregar</button>
<div id="lista-admin" class="mt-6"></div>
<div class="mt-4 p-3 bg-emerald-50 rounded-xl text-xs">Tip: después de cargar todo, dale a Compartir > tu link es este archivo. Cuando quieras cobrar suscripción, lo subimos a tulink.uy/nombre</div>
</div></div>

<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end justify-center"><div class="bg-white w-full max-w-md rounded-t-3xl p-5"><div class="flex justify-between"><b>Pedido</b><button onclick="cerrar()">x</button></div><div id="items"></div><button onclick="wsp()" class="w-full bg-[#25D366] text-white rounded-2xl py-3 mt-4 font-bold">Enviar por WhatsApp</button></div></div>

<script>
const sesionVendedor = JSON.parse(sessionStorage.getItem('vendedor_sesion') || 'null');
if (!sesionVendedor || !sesionVendedor.id) {
  window.location.replace('index.html');
}

const vendedorId = sesionVendedor?.id || 'default';
const vendedorNombre = sesionVendedor?.nombre || 'Catálogo';
const vendedorWsp = (sesionVendedor?.whatsapp || '59899414428').replace(/\D/g, '');
const storageKey = `prods_${vendedorId}`;

document.getElementById('titulo-vendedor').innerText = vendedorNombre;
document.getElementById('badge-vendedor').innerText = (vendedorNombre.trim()[0] || 'V').toUpperCase();
document.title = `${vendedorNombre} - Catálogo`;

let prods = JSON.parse(localStorage.getItem(storageKey) || '[]');
let cart = []; let foto64='';
document.getElementById('foto').addEventListener('change', e=>{ let r=new FileReader(); r.onload=()=>foto64=r.result; r.readAsDataURL(e.target.files[0]); });

function salirVendedor(){
  sessionStorage.removeItem('vendedor_sesion');
  sessionStorage.removeItem('admin_auth');
  window.location.replace('index.html');
}
function agregar(){
let nombre=document.getElementById('n').value; let precio=parseInt(document.getElementById('p').value); let cat=document.getElementById('c').value;
if(!nombre||!precio||!foto64) return alert('Falta nombre, precio y foto');
prods.unshift({id:Date.now(),nombre,precio,categoria:cat,foto:foto64}); localStorage.setItem(storageKey,JSON.stringify(prods));
document.getElementById('n').value=''; document.getElementById('p').value=''; document.getElementById('foto').value=''; foto64=''; pintar();
}
function pintar(){
let q=document.getElementById('busc').value.toLowerCase(); let g=document.getElementById('grid');
let f=prods.filter(p=>p.nombre.toLowerCase().includes(q));
g.innerHTML=f.map(p=>`<div class="bg-white rounded-3xl border p-3"><img src="${p.foto}" class="w-full h-28 object-cover rounded-2xl mb-2"><p class="text-[10px] text-gray-400 uppercase">${p.categoria}</p><h4 class="font-semibold text-sm h-10 leading-tight">${p.nombre}</h4><div class="flex justify-between mt-2"><b>$${p.precio}</b><button onclick="add(${p.id})" class="bg-black text-white text-xs px-3 py-1 rounded-full">Agregar</button></div></div>`).join('');
document.getElementById('lista-admin').innerHTML=prods.map(p=>`<div class="flex justify-between border-b py-2 text-sm"><span>${p.nombre} $${p.precio}</span><button onclick="del(${p.id})" class="text-red-500">Borrar</button></div>`).join('');
}
function add(id){ let it=cart.find(c=>c.id==id); if(it) it.qty++; else cart.push({id,qty:1}); document.getElementById('count').innerText=cart.reduce((a,b)=>a+b.qty,0); }
function del(id){ prods=prods.filter(p=>p.id!=id); localStorage.setItem(storageKey,JSON.stringify(prods)); pintar(); }
function vista(v){ document.getElementById('v-cliente').classList.toggle('hidden',v!='cliente'); document.getElementById('v-admin').classList.toggle('hidden',v!='admin'); }
function verCarrito(){ document.getElementById('modal').classList.remove('hidden'); let t=0; let html=''; cart.forEach(c=>{let p=prods.find(x=>x.id==c.id); t+=p.precio*c.qty; html+=`<div class="flex justify-between py-2 border-b text-sm"><span>${p.nombre} x${c.qty}</span><b>$${p.precio*c.qty}</b></div>`;}); html+=`<div class="flex justify-between font-black pt-2"><span>Total</span><span>$${t}</span></div>`; document.getElementById('items').innerHTML=html||'Vacío'; }
function cerrar(){document.getElementById('modal').classList.add('hidden');}
function wsp(){ let t=0; let m='Hola! Quiero:%0A'; cart.forEach(c=>{let p=prods.find(x=>x.id==c.id); m+=`- ${p.nombre} x${c.qty} $${p.precio*c.qty}%0A`; t+=p.precio*c.qty;}); m+=`Total $${t}`; window.open(`https://wa.me/${vendedorWsp}?text=${m}`,'_blank'); }
pintar();
</script>
</body>
</html>
