<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:sans-serif}</style>
</head>
<body class="bg-gray-50">
<div class="bg-white border-b sticky top-0 z-20">
<div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2 flex-wrap">
<div class="flex gap-3 items-center"><div id="badge-vendedor" class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white font-black">V</div><b id="titulo-vendedor">Catálogo</b></div>
<div class="flex gap-2 flex-wrap items-center">
<button onclick="vista('cliente')" class="px-3 py-1.5 bg-black text-white rounded-full text-sm">Ver catálogo</button>
<button id="btn-panel" onclick="vista('admin')" class="px-3 py-1.5 bg-emerald-100 text-emerald-900 font-semibold rounded-full text-sm">Crear / Editar catálogo</button>
<button onclick="verCarrito()" class="px-3 py-1.5 bg-emerald-500 text-white rounded-full text-sm font-bold">🛒 <span id="count">0</span> · $<span id="total-top">0</span></button>
<button id="btn-salir" onclick="salirVendedor()" class="px-3 py-1.5 bg-rose-100 text-rose-700 rounded-full text-sm font-semibold">Salir</button>
</div>
</div></div>

<div id="v-cliente" class="max-w-5xl mx-auto p-4">
<div id="barra-compartir" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-2xl flex flex-wrap justify-between items-center gap-2">
<div class="text-xs text-emerald-950"><b>Enlace para tus clientes:</b> <span id="link-cliente" class="underline break-all"></span></div>
<button onclick="copiarLinkCliente()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Copiar enlace</button>
</div>
<input id="busc" oninput="pintar()" placeholder="Buscar producto o sabor/aroma..." class="w-full p-3 rounded-2xl border bg-white">
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4"></div>
</div>

<div id="v-admin" class="hidden max-w-5xl mx-auto p-4">
<div class="bg-white p-5 rounded-3xl border">
<h2 class="font-bold text-lg">Crear / Cargar productos del catálogo</h2>
<p class="text-xs text-gray-500 mb-3">Cargá foto, nombre y precio. Si tiene varios sabores o aromas, separalos por coma.</p>
<input id="n" placeholder="Nombre Ej: Head & Shoulders" class="w-full border rounded-xl p-2 mb-2 text-sm">
<input id="v" placeholder="Sabores / Aromas / Variantes (opcional, ej: Menta, Coco, Manzana)" class="w-full border rounded-xl p-2 mb-2 text-sm">
<input id="p" type="number" placeholder="Precio Ej: 189" class="w-full border rounded-xl p-2 mb-2 text-sm">
<select id="c" class="w-full border rounded-xl p-2 mb-2 text-sm"><option value="limpieza">Limpieza</option><option value="comida">Comida</option><option value="higiene">Higiene</option></select>
<input id="foto" type="file" accept="image/*" class="w-full text-sm mb-3">
<button id="btn-agregar" onclick="agregar()" class="w-full bg-black text-white rounded-xl py-3 font-bold text-sm">+ Agregar producto</button>
<div id="lista-admin" class="mt-6"></div>
</div></div>

<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end justify-center"><div class="bg-white w-full max-w-md rounded-t-3xl p-5"><div class="flex justify-between items-center mb-3"><b class="text-base">Tu pedido</b><button onclick="cerrar()" class="px-2 py-1 text-sm font-bold">✕</button></div><div id="items"></div><button onclick="wsp()" class="w-full bg-[#25D366] text-white rounded-2xl py-3 mt-4 font-bold">Enviar pedido por WhatsApp</button></div></div>

<script>
const supabaseClient = window.supabase.createClient(
  'https://ssrbtstsognusylmiusw.supabase.co',
  'sb_publishable_C7Tf8n553yR4Fem9kzWdSQ_Y_UXu7-j'
);

const params = new URLSearchParams(window.location.search);
const vendedorUrlId = (params.get('v') || '').trim().toLowerCase();
const sesionVendedor = JSON.parse(sessionStorage.getItem('vendedor_sesion') || 'null');

if (!vendedorUrlId && (!sesionVendedor || !sesionVendedor.id)) {
  window.location.replace('index.html');
}

const esModoClientePublico = Boolean(vendedorUrlId);
const vendedorId = vendedorUrlId || sesionVendedor?.id || 'default';
let vendedorNombre = sesionVendedor?.nombre || (vendedorUrlId ? `Catálogo ${vendedorUrlId}` : 'Catálogo');
let vendedorWsp = (sesionVendedor?.whatsapp || '59899414428').replace(/\D/g, '');
const urlCliente = `${window.location.origin}${window.location.pathname}?v=${encodeURIComponent(vendedorId)}`;

function aplicarDatosVendedor() {
  document.getElementById('titulo-vendedor').innerText = vendedorNombre;
  document.getElementById('badge-vendedor').innerText = (vendedorNombre.trim()[0] || 'V').toUpperCase();
  document.title = `${vendedorNombre} - Catálogo`;
}
aplicarDatosVendedor();

if (esModoClientePublico) {
  document.getElementById('btn-panel').classList.add('hidden');
  document.getElementById('btn-salir').classList.add('hidden');
} else {
  document.getElementById('barra-compartir').classList.remove('hidden');
  document.getElementById('link-cliente').innerText = urlCliente;
}

let prods = [];
let cart = [];
let foto64 = '';

document.getElementById('foto').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 700;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      foto64 = canvas.toDataURL('image/jpeg', 0.75);
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

async function cargarDatosVendedor() {
  if (esModoClientePublico) {
    const { data: vend } = await supabaseClient
      .from('vendedores')
      .select('nombre, whatsapp')
      .eq('id', vendedorId)
      .maybeSingle();
    if (vend) {
      if (vend.nombre) vendedorNombre = vend.nombre;
      if (vend.whatsapp) vendedorWsp = String(vend.whatsapp).replace(/\D/g, '');
      aplicarDatosVendedor();
    }
  }

  document.getElementById('grid').innerHTML = '<p class="text-sm text-gray-500 col-span-full">Cargando catálogo...</p>';
  const { data, error } = await supabaseClient
    .from('productos')
    .select('*')
    .eq('vendedor_id', vendedorId)
    .order('id', { ascending: false });

  if (error) {
    document.getElementById('grid').innerHTML = `<p class="text-sm text-rose-600 col-span-full">Error al cargar productos: ${error.message}</p>`;
    return;
  }

  prods = data || [];
  pintar();
}

function copiarLinkCliente() {
  navigator.clipboard?.writeText(urlCliente);
  alert('Enlace copiado para tus clientes:\n' + urlCliente);
}

function salirVendedor() {
  sessionStorage.removeItem('vendedor_sesion');
  sessionStorage.removeItem('admin_auth');
  window.location.replace('index.html');
}

async function agregar() {
  if (esModoClientePublico) return;
  const nombreBase = document.getElementById('n').value.trim();
  const variantesRaw = document.getElementById('v').value.trim();
  const precio = parseInt(document.getElementById('p').value, 10);
  const cat = document.getElementById('c').value;
  if (!nombreBase || !precio || !foto64) return alert('Falta nombre, precio y foto');

  const variantes = variantesRaw
    ? variantesRaw.split(',').map(s => s.trim()).filter(Boolean)
    : [];

  const filas = variantes.length
    ? variantes.map(op => ({
        vendedor_id: vendedorId,
        nombre: `${nombreBase} [${op}]`,
        precio,
        categoria: cat,
        foto: foto64
      }))
    : [{
        vendedor_id: vendedorId,
        nombre: nombreBase,
        precio,
        categoria: cat,
        foto: foto64
      }];

  const btn = document.getElementById('btn-agregar');
  btn.disabled = true;
  btn.innerText = 'Guardando...';

  const { error } = await supabaseClient.from('productos').insert(filas);

  btn.disabled = false;
  btn.innerText = '+ Agregar producto';

  if (error) return alert('Error al guardar producto: ' + error.message);

  document.getElementById('n').value = '';
  document.getElementById('v').value = '';
  document.getElementById('p').value = '';
  document.getElementById('foto').value = '';
  foto64 = '';
  await cargarDatosVendedor();
  vista('cliente');
}

function actualizarResumenCarrito() {
  const totalUnidades = cart.reduce((a, b) => a + b.qty, 0);
  const totalMonto = cart.reduce((acc, c) => {
    const p = prods.find(x => x.id == c.id);
    return acc + (p ? p.precio * c.qty : 0);
  }, 0);
  document.getElementById('count').innerText = totalUnidades;
  document.getElementById('total-top').innerText = totalMonto;
}

function pintar() {
  const q = document.getElementById('busc').value.toLowerCase();
  const g = document.getElementById('grid');
  const f = prods.filter(p => p.nombre.toLowerCase().includes(q));
  g.innerHTML = f.length ? f.map(p => `
    <div class="bg-white rounded-3xl border p-3">
      <img src="${p.foto}" class="w-full h-28 object-cover rounded-2xl mb-2">
      <p class="text-[10px] text-gray-400 uppercase">${p.categoria}</p>
      <h4 class="font-semibold text-sm h-10 leading-tight">${p.nombre}</h4>
      <div class="flex justify-between items-center mt-2">
        <b>$${p.precio}</b>
        <button onclick="add(${p.id})" class="bg-black text-white text-xs px-3 py-1 rounded-full">+ Sumar</button>
      </div>
    </div>
  `).join('') : '<p class="text-sm text-gray-500 col-span-full">Todavía no hay productos cargados en este catálogo.</p>';

  document.getElementById('lista-admin').innerHTML = prods.map(p => `
    <div class="flex justify-between border-b py-2 text-sm">
      <span>${p.nombre} — $${p.precio}</span>
      <button onclick="del(${p.id})" class="text-red-500 font-semibold">Borrar</button>
    </div>
  `).join('');
  actualizarResumenCarrito();
}

function add(id) {
  const it = cart.find(c => c.id == id);
  if (it) it.qty++;
  else cart.push({ id, qty: 1 });
  actualizarResumenCarrito();
}

function cambiarCant(id, delta) {
  const it = cart.find(c => c.id == id);
  if (!it) return;
  it.qty += delta;
  if (it.qty <= 0) cart = cart.filter(c => c.id != id);
  actualizarResumenCarrito();
  verCarrito();
}

async function del(id) {
  if (esModoClientePublico) return;
  const { error } = await supabaseClient.from('productos').delete().eq('id', id).eq('vendedor_id', vendedorId);
  if (error) return alert('Error al borrar: ' + error.message);
  await cargarDatosVendedor();
}

function vista(v) {
  if (esModoClientePublico && v === 'admin') return;
  document.getElementById('v-cliente').classList.toggle('hidden', v != 'cliente');
  document.getElementById('v-admin').classList.toggle('hidden', v != 'admin');
}

function verCarrito() {
  document.getElementById('modal').classList.remove('hidden');
  let t = 0;
  const html = cart.map(c => {
    const p = prods.find(x => x.id == c.id);
    if (!p) return '';
    const sub = p.precio * c.qty;
    t += sub;
    return `
      <div class="flex justify-between items-center py-2 border-b text-sm gap-2">
        <div>
          <div class="font-semibold">${p.nombre}</div>
          <div class="text-xs text-gray-500">$${p.precio} c/u</div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="cambiarCant(${p.id}, -1)" class="w-6 h-6 rounded-full bg-gray-200 font-bold">-</button>
          <span class="font-bold">${c.qty}</span>
          <button onclick="cambiarCant(${p.id}, 1)" class="w-6 h-6 rounded-full bg-gray-200 font-bold">+</button>
          <b class="ml-1">$${sub}</b>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('items').innerHTML = html
    ? `${html}<div class="flex justify-between font-black text-base pt-3"><span>Total a pagar</span><span>$${t}</span></div>`
    : '<p class="text-sm text-gray-500 py-4">Tu carrito está vacío. Tocá "+ Sumar" en los productos.</p>';
}

function cerrar() {
  document.getElementById('modal').classList.add('hidden');
}

function wsp() {
  if (!cart.length) return alert('Agregá al menos un producto al pedido.');
  let t = 0;
  let m = `Hola *${vendedorNombre}*! Quiero hacer este pedido:%0A%0A`;
  cart.forEach(c => {
    const p = prods.find(x => x.id == c.id);
    if (!p) return;
    const sub = p.precio * c.qty;
    t += sub;
    m += `• ${p.nombre} (x${c.qty}) — $${sub}%0A`;
  });
  m += `%0A*Total: $${t}*`;
  window.open(`https://wa.me/${vendedorWsp}?text=${m}`, '_blank');
}

cargarDatosVendedor();
</script>
</body>
</html>
